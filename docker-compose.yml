services:
  app:
    build: .
    ports:
      - "3001:3000"
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: your_password
      DB_NAME: todolist_db
      DB_DIALECT: mysql
      PORT: 3000
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - db
    networks:
      - net-tp

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: todolist_db
      MYSQL_ROOT_PASSWORD: your_password
    ports:
      - "3306:3306"
    networks:
      - net-tp

networks:
  net-tp: